<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SlaydAI</title>
<!-- Telegram skripti O‘Z skriptingizdan OLDIN yuklanishi shart -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b0713;--card:#15111f;--line:#3a3150;--tx:#f4f1fb;--mute:#a79fba;--a:#22d3ee;--b:#8b5cf6;--c:#d46bd8;--err:#ff7a8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));
background:radial-gradient(120% 60% at 0% 0%,#3b2468 0%,transparent 60%),radial-gradient(90% 50% at 100% 100%,#0f5a68 0%,transparent 60%),var(--bg);background-attachment:fixed}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:520px;margin:0 auto}
h1{font-size:30px;margin:6px 0 4px;letter-spacing:-.5px}
h1 b{background:linear-gradient(90deg,var(--b),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);margin:0 0 14px}
.bar{display:flex;gap:6px;margin-bottom:16px}
.bar i{flex:1;height:5px;border-radius:5px;background:#3a3150}
.bar i.on{background:linear-gradient(90deg,var(--a),var(--c))}
.card{background:rgba(21,17,31,.85);border:1px solid var(--line);border-radius:24px;padding:20px}
.card h2{font-size:21px;margin:6px 0 14px}
label{display:block;color:var(--mute);font-size:13px;margin:14px 0 6px}
input,textarea,select{width:100%;font:inherit;font-size:16px;color:var(--tx);background:#0e0b16;border:1px solid var(--line);border-radius:16px;padding:13px 15px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--b);box-shadow:0 0 0 3px rgba(139,92,246,.3)}
textarea{resize:vertical;min-height:90px}
input[type=range]{padding:0;accent-color:var(--b)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#0e0b16;color:var(--tx);border-radius:999px;padding:9px 15px;font:inherit;cursor:pointer}
.chip.on{background:linear-gradient(90deg,var(--b),var(--c));border-color:transparent}
.row{display:flex;gap:8px;margin-top:8px}
.row input{flex:1}
.x{flex:0 0 46px;border:1px solid var(--line);background:#0e0b16;color:var(--mute);border-radius:14px;font-size:18px;cursor:pointer}
.err{color:var(--err);min-height:22px;margin:12px 0 0}
.nav{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border:0;border-radius:20px;padding:16px;font:inherit;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(90deg,var(--a),var(--b) 55%,var(--c));touch-action:manipulation}
.btn.ghost{flex:0 0 34%;background:#1d1830;border:1px solid var(--line);font-weight:500}
.btn:disabled{opacity:.55}
.hint{color:var(--mute);font-size:14px;margin-top:10px}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<main>
  <h1>Slayd<b>AI</b></h1>
  <p class="sub">Mavzuni yozing, taqdimot tayyor bo‘ladi.</p>
  <div class="bar" id="bar"></div>
  <section class="card" id="card"></section>
  <p class="err" id="err" role="alert"></p>
  <div class="nav">
    <button type="button" class="btn ghost" id="back">Orqaga</button>
    <button type="button" class="btn" id="next">Davom etish</button>
  </div>
</main>

<script>
"use strict";
var tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

// Bot (bot.py) bilan bir xil cheklovlar
var MAX_BYTES = 4096, RESERVED = 3;
var TEMPLATES = ["classic", "modern", "dark"]; // generatoringizdagi haqiqiy nomlarga almashtiring
var PLAN_API = ""; // ixtiyoriy: "https://domen.uz/api/plan" -> {plan:[...]} qaytarishi kerak

var S = {
  step: 0, busy: false, sent: false,
  info: { univ: "", fac: "", dir: "", name: "", group: "", teacher: "", subj: "", city: "", year: "" },
  topic: "", lang: "uz", pages: 12, tpl: "modern", variant: 0, plan: []
};

var DEFAULT_PLAN = {
  uz: ["Kirish", "Asosiy tushunchalar", "Mavzuning nazariy asoslari", "Amaliy misollar va tahlil", "Muammolar va yechimlar", "Xulosa"],
  ru: ["Введение", "Основные понятия", "Теоретические основы", "Практические примеры", "Проблемы и решения", "Заключение"],
  en: ["Introduction", "Key concepts", "Theoretical background", "Practical examples", "Challenges and solutions", "Conclusion"]
};

var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function clean(s) { return String(s || "").replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/g, "").replace(/\s+/g, " ").trim(); }
function bytes(s) { return new TextEncoder().encode(s).length; }
function field(label, path, ph) {
  return '<label for="f_' + path + '">' + label + '</label><input id="f_' + path + '" data-path="' + path + '" value="' + esc(S.info[path]) + '" placeholder="' + (ph || "") + '" maxlength="250" autocomplete="off">';
}

var STEPS = [
  { icon: "🏛️", title: "Avval universitetingizni kiriting", html: function () {
    return field("Universitet / OTM (to‘liq nomi)", "univ") + field("Fakultet", "fac") + field("Ta’lim yo‘nalishi", "dir"); } },
  { icon: "👤", title: "Talaba ma’lumotlari", html: function () {
    return field("Ism-familiya", "name") + field("Fan nomi", "subj") + field("Guruh", "group") +
      field("O‘qituvchi", "teacher") + field("Shahar", "city") + field("Yil", "year", "2026"); } },
  { icon: "📝", title: "Taqdimot mavzusi", html: function () {
    return '<label for="topic">Mavzu</label><textarea id="topic" data-root="topic" maxlength="250">' + esc(S.topic) + '</textarea>' +
      '<label>Taqdimot tili</label><div class="chips">' +
      [["uz", "O‘zbekcha"], ["ru", "Русский"], ["en", "English"]].map(function (l) {
        return '<button type="button" class="chip' + (S.lang === l[0] ? " on" : "") + '" data-act="lang" data-v="' + l[0] + '">' + l[1] + '</button>'; }).join("") + '</div>'; } },
  { icon: "🎨", title: "Slaydlar va shablon", html: function () {
    return '<label for="pages">Slaydlar soni: <b id="pv">' + S.pages + '</b></label><input id="pages" type="range" min="8" max="30" value="' + S.pages + '">' +
      '<label>Shablon</label><div class="chips">' + TEMPLATES.map(function (t) {
        return '<button type="button" class="chip' + (S.tpl === t ? " on" : "") + '" data-act="tpl" data-v="' + t + '">' + t + '</button>'; }).join("") + '</div>' +
      '<label>Rang varianti</label><div class="chips">' + [0, 1, 2, 3, 4, 5].map(function (n) {
        return '<button type="button" class="chip' + (S.variant === n ? " on" : "") + '" data-act="var" data-v="' + n + '">' + (n + 1) + '</button>'; }).join("") + '</div>'; } },
  { icon: "📋", title: "Taqdimot rejasi", html: function () {
    var max = Math.min(12, S.pages - RESERVED);
    return S.plan.map(function (p, i) {
      return '<div class="row"><input data-plan="' + i + '" value="' + esc(p) + '" maxlength="120" aria-label="Reja ' + (i + 1) + '"><button type="button" class="x" data-act="del" data-v="' + i + '" aria-label="O‘chirish">×</button></div>'; }).join("") +
      '<div class="row">' + (S.plan.length < max ? '<button type="button" class="chip" data-act="add">+ Band qo‘shish</button>' : "") +
      '<button type="button" class="chip" data-act="regen">Rejani qayta yaratish</button></div>' +
      '<p class="hint">3–' + max + ' ta band. Taqdimotni yaratish uchun «Yaratish» tugmasini bosing.</p>'; } }
];

function render() {
  var st = STEPS[S.step];
  $("bar").innerHTML = STEPS.map(function (_, i) { return '<i class="' + (i <= S.step ? "on" : "") + '"></i>'; }).join("");
  $("card").innerHTML = '<div style="font-size:34px">' + st.icon + '</div><h2>' + st.title + '</h2>' + st.html();
  $("back").style.visibility = S.step ? "visible" : "hidden";
  $("next").textContent = S.step === STEPS.length - 1 ? "Yaratish" : "Davom etish";
  $("err").textContent = "";
}

function validate(step) {
  var i = S.info, k;
  if (step === 0) { if (clean(i.univ).length < 1) return "Universitet nomini kiriting."; }
  if (step === 1) {
    if (!clean(i.name)) return "Ism-familiyani kiriting.";
    if (!clean(i.subj)) return "Fan nomini kiriting.";
    if (clean(i.year) && !/^(19|20)\d{2}$/.test(clean(i.year))) return "Yil to‘rt xonali son bo‘lishi kerak (masalan, 2026).";
  }
  if (step === 2 && clean(S.topic).length < 3) return "Mavzu kamida 3 belgidan iborat bo‘lsin.";
  if (step === 4) {
    var plan = S.plan.map(clean).filter(Boolean);
    if (plan.length < 3) return "Rejada kamida 3 ta band bo‘lsin.";
    for (k = 0; k < plan.length; k++) if (plan[k].length < 2) return "Reja bandi kamida 2 belgidan iborat bo‘lsin.";
    if (plan.length > S.pages - RESERVED) return S.pages + " ta slaydga " + plan.length + " ta band sig‘maydi. Slaydlarni ko‘paytiring yoki rejani qisqartiring.";
  }
  return "";
}

function buildPayload() {
  var info = {}, k;
  for (k in S.info) { var v = clean(S.info[k]); if (v) info[k] = v; } // bo‘shlari yuborilmaydi: hajm tejaladi
  return { topic: clean(S.topic), lang: S.lang, pages: S.pages, template: S.tpl + ":" + S.variant, info: info, plan: S.plan.map(clean).filter(Boolean) };
}

function defaultPlan() { return DEFAULT_PLAN[S.lang].slice(0, Math.min(12, S.pages - RESERVED)); }

function loadPlan() {
  S.plan = defaultPlan(); // darhol ko‘rsatamiz, tugma qotib qolmaydi
  if (!PLAN_API) return Promise.resolve();
  var ctl = new AbortController(), t = setTimeout(function () { ctl.abort(); }, 8000);
  return fetch(PLAN_API, { method: "POST", headers: { "Content-Type": "application/json" }, signal: ctl.signal,
    body: JSON.stringify({ topic: clean(S.topic), lang: S.lang, pages: S.pages }) })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (d) {
      if (d && Array.isArray(d.plan) && d.plan.length >= 3) S.plan = d.plan.map(clean).filter(Boolean).slice(0, Math.min(12, S.pages - RESERVED));
    })
    .catch(function (e) { console.warn("Reja API xatosi, standart reja ishlatildi:", e); })
    .then(function () { clearTimeout(t); });
}

function submit() {
  var json = JSON.stringify(buildPayload());
  if (bytes(json) > MAX_BYTES) { $("err").textContent = "Ma’lumot juda katta (" + bytes(json) + " bayt, chegara " + MAX_BYTES + "). Matnlarni qisqartiring."; return; }
  if (!tg || !tg.sendData || !tg.initData) { $("err").textContent = "Bu sahifani Telegram botdagi «Taqdimot yaratish» tugmasi orqali oching."; return; }
  S.sent = true; $("next").disabled = true;
  tg.sendData(json); // Mini App yopiladi, bot faylni yuboradi
}

function go() {
  if (S.busy || S.sent) return;
  var e = validate(S.step);
  if (e) { $("err").textContent = e; return; }
  if (S.step === STEPS.length - 1) return submit();
  S.busy = true; $("next").disabled = true;
  var next = S.step + 1;
  var p = next === 4 ? loadPlan() : Promise.resolve();
  p.then(function () { S.step = next; render(); window.scrollTo(0, 0); })
   .catch(function (er) { console.error(er); $("err").textContent = "Xatolik yuz berdi, qayta urinib ko‘ring."; })
   .then(function () { S.busy = false; $("next").disabled = false; });
}

// Hodisalar: bitta joyda (delegation), shuning uchun qayta render qilinganda tugmalar "o‘lmaydi"
$("next").addEventListener("click", go);
$("back").addEventListener("click", function () { if (S.step && !S.busy) { S.step--; render(); } });
var card = $("card");
card.addEventListener("input", function (ev) {
  var t = ev.target;
  if (t.dataset.path) S.info[t.dataset.path] = t.value;
  else if (t.dataset.root) S[t.dataset.root] = t.value;
  else if (t.dataset.plan !== undefined) S.plan[+t.dataset.plan] = t.value;
  else if (t.id === "pages") { S.pages = +t.value; $("pv").textContent = t.value; }
  $("err").textContent = "";
});
card.addEventListener("click", function (ev) {
  var b = ev.target.closest("[data-act]");
  if (!b) return;
  var a = b.dataset.act, v = b.dataset.v;
  if (a === "lang") S.lang = v;
  else if (a === "tpl") S.tpl = v;
  else if (a === "var") S.variant = +v;
  else if (a === "del") S.plan.splice(+v, 1);
  else if (a === "add") S.plan.push("");
  else if (a === "regen") S.plan = defaultPlan();
  render();
});

window.addEventListener("error", function (e) { $("err").textContent = "Xato: " + e.message; });
render();
</script>
</body>
</html>
