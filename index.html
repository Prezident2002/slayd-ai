function su(){
$("#v").innerHTML=`<div class="sc"><div class="card"><div style="font-size:34px">🏛</div><b style="font-size:18px">Avval universitetingizni kiriting</b><p class="sub" style="margin:6px 0 0">To‘liq rasmiy nomini yozing — shablonlar, ranglar va ma’lumotlar ta’lim yo‘nalishingizga moslanadi</p>
<label>Universitet / OTM (to‘liq nomi)</label><input id="un" list="ul" value="${esc(S.f.univ)}" placeholder="Masalan: Toshkent davlat iqtisodiyot universiteti"><datalist id="ul">${UN.map(u=>`<option value="${u}">`).join("")}</datalist>
<label>Fakultet</label><input id="fc" value="${esc(S.f.fac)}" placeholder="Fakultet nomi">
<label>Ta’lim yo‘nalishi</label><input id="dr2" value="${esc(S.f.dir)}" placeholder="Masalan: Menejment">
<div class="note" id="dt" style="text-align:left"></div></div><button class="btn" id="nx">Davom etish →</button></div>`;
const up=()=>{S.f.univ=$("#un").value;S.f.fac=$("#fc").value;S.f.dir=$("#dr2").value;const u=nm(S.f.univ+" "+S.f.fac+" "+S.f.dir),m=TPL.filter(x=>UK[x.id].test(u)).map(x=>x.n);$("#dt").innerHTML=m.length?"🎯 Aniqlangan yo‘nalish: <b>"+m.slice(0,3).join(", ")+"</b>":"💡 Yo‘nalish mavzu bo‘yicha ham aniqlanadi"};
["#un","#fc","#dr2"].forEach(q=>$(q).oninput=up);up();
$("#nx").onclick=()=>{if(S.f.univ.trim().split(/\s+/).length<2){$("#un").focus();return}go(0)}}
const PLAN={uz:["Kirish","Asosiy tushunchalar va nazariy asoslar","Hozirgi holati va tahlil","Muammolar, rivojlanish istiqbollari","Xulosa","Foydalanilgan adabiyotlar"],
ru:["Введение","Основные понятия и теоретические основы","Современное состояние и анализ","Проблемы и перспективы развития","Заключение","Список литературы"],
en:["Introduction","Core concepts and theoretical foundations","Current state and analysis","Challenges and future prospects","Conclusion","References"]};
const L={uz:"🇺🇿 O‘zbekcha",ru:"🇷🇺 Русский",en:"🇬🇧 English"};
const IDEAS=["Sun’iy intellekt","Global isinish","Amir Temur davlati","Raqamli iqtisodiyot"];
const FL=[["univ","Universitet / OTM","Masalan: TATU"],["fac","Fakultet","Fakultet nomi"],["dir","Yo‘nalish","Ta’lim yo‘nalishi"],["subj","Fan nomi","Qaysi fan bo‘yicha"],["name","Talaba F.I.Sh.","Ism familiya"],["group","Guruh","Masalan: 301-21"],["teacher","O‘qituvchi","Fan o‘qituvchisi F.I.Sh."],["city","Shahar","Shahar"],["year","Yil","2026"]];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function rank(){const t=nm(S.topic),tws=t.split(/[^a-z0-9']+/).filter(Boolean),u=nm(S.f.univ+" "+S.f.fac+" "+S.f.dir);return TPL.map(x=>{const tw=x.k.split(" ").filter(w=>tws.some(z=>w.length<4?z==w:z.startsWith(w.slice(0,5)))).length,uw=UK[x.id].test(u)?1:0;return{...x,tw,uw,sc:tw*3+uw*2}}).sort((a,b)=>b.sc-a.sc)}
function slide(t,x,k=0){let b;
if(k==0)b=`${M(t)}<em>${esc(x)}</em><small>${t.n}</small><s style="width:30%"></s>`;
else if(k==1)b=`<em>01 · ${esc(PLAN[S.lang][1])}</em><s></s><s style="width:38%"></s><s style="width:46%"></s><div class="ph" style="border-color:${t.ac}">🖼</div>`;
else b=`<em class="st2" style="font-size:30px;color:${t.ac}">87%</em><small>${esc(PLAN[S.lang][2])}</small><s></s>`;
return `<div class="sl v${t.v||0}" style="--bg2:${t.bg};--ac:${t.ac};--ff:${t.ff}">${b}</div>`}
function head(){$("#st").innerHTML=[-1,0,1,2,3].map(i=>`<i class="${i<=S.step?'on':''}"></i>`).join("")}
function go(n){S.step=n;draw();scrollTo({top:0,behavior:"smooth"})}
function draw(){head();([su,s0,s1,s2,s3][S.step+1])()}
function s0(){
$("#v").innerHTML=`<div class="sc"><div class="card"><label>1 · Mavzu</label>
<textarea id="tp" placeholder="Taqdimot mavzusini yozing...">${esc(S.topic)}</textarea>
<div class="chips">${IDEAS.map(i=>`<span>${i}</span>`).join("")}</div>
<label>Taqdimot tili</label><div class="seg">${Object.keys(L).map(k=>`<button data-l="${k}" class="${S.lang==k?'on':''}">${L[k]}</button>`).join("")}</div>
<label>Slaydlar soni: <b id="pn">${S.pages}</b></label><input type="range" id="pg" min="8" max="30" value="${S.pages}" style="padding:0;accent-color:#f472b6"></div>
<button class="btn" id="nx">AI shablon tanlasin →</button><button class="btn ghost" id="bk">← Universitet</button></div>`;
$("#tp").oninput=e=>S.topic=e.target.value;
document.querySelectorAll(".chips span").forEach(c=>c.onclick=()=>{S.topic=c.textContent;$("#tp").value=S.topic});
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{S.lang=b.dataset.l;S.plan=[...PLAN[S.lang]];s0()});
$("#pg").oninput=e=>{S.pages=e.target.value;$("#pn").textContent=S.pages};$("#bk").onclick=()=>go(-1);
$("#nx").onclick=()=>{S.topic=$("#tp").value.trim();if(S.topic.length<3){$("#tp").focus();return}S.tpl=null;go(1)}}
function TP(){const[i,v]=String(S.tpl).split(":");return{...TPL.find(x=>x.id==i),v:+v||0}}
const VN=["Klassik","Teskari","Yorug‘","Markaziy","Rang 2","Rang 3"];
const card=(t,v,b)=>`<div class="t ${S.tpl==t.id+":"+v?'on':''}" data-t="${t.id}:${v}">${b?'<span class="rec">'+b+'</span>':''}${slide({...t,v},S.topic)}<b>${t.n} · ${VN[v]}</b><small>${t.d}</small></div>`;
function s1(){const r=rank(),top=r[0];if(!S.tpl)S.tpl=top.id+":0";
$("#v").innerHTML=`<div class="sc"><div class="card"><b>“${esc(S.topic)}”</b><div class="sub" style="margin:4px 0 0">🏛 ${esc(S.f.univ)} · ${L[S.lang]}</div></div>
<b style="display:block;margin:0 2px 10px">⭐ ${top.n}: ${top.d}</b><div class="grid">${VN.map((_,v)=>card(top,v,v==0&&top.sc>0?(top.tw?'AI TAVSIYA':'OTM PROFILI'):'')).join("")}</div><b style="display:block;margin:16px 2px 10px">Boshqa yo‘nalishlar</b><div class="grid">${r.slice(1,S.all?99:5).map(t=>card(t,0,'')).join("")}</div>
${S.all?'':'<button class="btn ghost" id="al">Barcha 16 yo‘nalish ▾</button>'}<div class="card" style="margin-top:14px"><b>👀 Tanlangan shablon: slaydlar namunasi</b><div class="strip">${[0,1,2].map(k=>slide(TP(),S.topic,k)).join("")}</div></div>
<button class="btn" id="nx" style="margin-top:6px">Davom etish →</button><button class="btn ghost" id="bk">← Orqaga</button></div>`;
document.querySelectorAll(".t").forEach(e=>e.onclick=()=>{S.tpl=e.dataset.t;s1()});
$("#nx").onclick=()=>go(2);$("#bk").onclick=()=>go(0);const al=$("#al");if(al)al.onclick=()=>{S.all=1;s1()}}
function s2(){const t=TP();
$("#v").innerHTML=`<div class="sc"><div class="card big">${slide(t,S.topic)}</div>
<div class="card"><b>Titul varaqasi ma’lumotlari</b>${FL.map(([k,l,p])=>`<label>${l}</label><input data-k="${k}" value="${esc(S.f[k])}" placeholder="${p}">`).join("")}</div>
<button class="btn" id="nx">Rejani ko‘rish →</button><button class="btn ghost" id="bk">← Orqaga</button></div>`;
document.querySelectorAll("[data-k]").forEach(i=>i.oninput=e=>S.f[i.dataset.k]=e.target.value);
$("#nx").onclick=()=>{const m=["univ","subj","name"].find(k=>!S.f[k].trim());if(m){$(`[data-k=${m}]`).focus();return}go(3)};$("#bk").onclick=()=>go(1)}
function s3(){const p=S.plan||[...PLAN[S.lang]],t=TP();S.plan=p;
$("#v").innerHTML=`<div class="sc"><div class="card"><b>📋 Taqdimot rejasi</b><div class="sub" style="margin:4px 0 12px">Istasangiz bo‘lim nomlarini tahrirlang</div>
<ul class="plan">${p.map((x,i)=>`<li style="animation-delay:${i*.08}s"><span>${i+1}</span><input data-plan-index="${i}" value="${esc(x)}"></li>`).join("")}</ul></div>
<div class="card" style="font-size:13px;color:var(--mut)">👤 ${esc(S.f.name)} · ${esc(S.f.univ)}<br>🎨 ${t.n} · ${L[S.lang]} · ${S.pages} slayd</div>
<button class="btn" id="go">🚀 Taqdimotni yaratish</button><button class="btn ghost" id="bk">← Orqaga</button></div>`;
document.querySelectorAll("[data-plan-index]").forEach(i=>i.oninput=e=>S.plan[+e.target.dataset.planIndex]=e.target.value);$("#bk").onclick=()=>go(2);$("#go").onclick=()=>{S.plan=Array.from(document.querySelectorAll("[data-plan-index]")).map(i=>i.value.trim());if(S.plan.some(x=>x.length<2)){alert("Rejadagi har bir bo‘lim kamida 2 belgidan iborat bo‘lsin.");return}gen()}}
function gen(){const m=["Mavzu tahlil qilinmoqda...","Kitoblar va ishonchli saytlardan ma’lumot yig‘ilmoqda...","Faktlar tekshirilmoqda...","Mavzuga mos rasmlar tanlanmoqda...","Slaydlar dizayni yig‘ilmoqda...","Adabiyotlar ro‘yxati tuzilmoqda..."];let i=0;
$("#v").innerHTML=`<div class="card ld sc"><div class="ring"></div><b>AI ishlamoqda</b><p id="lm"></p><div class="bar"><div id="br"></div></div></div>`;
const tm=setInterval(()=>{$("#lm").textContent=m[i];$("#br").style.width=((i+1)/m.length*100)+"%";i++;if(i>m.length){clearInterval(tm);done()}},900)}
function done(){const d={topic:S.topic,lang:S.lang,pages:+S.pages,template:S.tpl,plan:S.plan||[...PLAN[S.lang]],info:S.f};
$("#v").innerHTML=`<div class="card sc" style="text-align:center"><div class="ok">🎉</div><h1 class="g" style="margin:8px 0">Tayyor!</h1><p class="sub">Backend ulangach, fayl shu yerda .pptx sifatida chatga yuboriladi.</p>
<button class="btn" id="sd">Botga yuborish</button><button class="btn ghost" id="rs">Yangi taqdimot</button></div>`;
$("#sd").onclick=()=>{if(tg)tg.sendData(JSON.stringify(d));else alert(JSON.stringify(d,null,1))};
$("#rs").onclick=()=>{S.topic="";S.tpl=null;go(0)}}
draw();
</script></body></html>
